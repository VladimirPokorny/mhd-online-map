services:
  idsjmk-map:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8000
      - GTFS_URL=${GTFS_URL-https://kordis-jmk.cz/gtfs/gtfs.zip}
      - GTFS_UPDATE_INTERVAL_HOURS=${GTFS_UPDATE_INTERVAL_HOURS:-6}
      # Live map (/zive); see .env.example.
      - LIVE=${LIVE:-true}
      - LIVE_TRAFFIC=${LIVE_TRAFFIC:-true}
      # Optional Umami analytics; set these in .env or Dokploy's Environment tab (see .env.example).
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - UMAMI_SCRIPT_URL=${UMAMI_SCRIPT_URL:-}
      - UMAMI_DOMAINS=${UMAMI_DOMAINS:-}
      - UMAMI_RECORDER=${UMAMI_RECORDER:-false}
      - UMAMI_FRAME_ANCESTORS=${UMAMI_FRAME_ANCESTORS:-}
      # The collector's history database, for the statistics page (/statistiky); read-only connections.
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-brno}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-brno}
    # Downloaded timetable versions and caches survive restarts and redeploys.
    volumes:
      - idsjmk-data:/app/data
    # Dokploy routes the domain to this port through its Traefik proxy.
    expose:
      - "8000"

  # History of Brno open data (parking, counters, weather, KORDIS delays, …) for statistics and predictions.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-brno}
      - POSTGRES_USER=${POSTGRES_USER:-brno}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
    volumes:
      - brno-pgdata:/var/lib/postgresql/data
    # Not published outside the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 256mb

  collector:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "collector", "run"]
    environment:
      # libpq's own variables: no URL encoding, so the password may contain any character.
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-brno}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-brno}
      - COLLECTOR_DISABLE=${COLLECTOR_DISABLE:-}
      - KORDIS_RAW_DIR=${KORDIS_RAW_DIR:-}
    volumes:
      - collector-raw:/app/raw
    depends_on:
      db:
        condition: service_healthy
    # Overrides the web app's health check of the image.
    healthcheck:
      test: ["CMD", "python", "-m", "collector", "health"]
      interval: 5m
      timeout: 60s
      start_period: 15m
      retries: 2
    # Jobs finish their current step on SIGTERM; the stream writes its buffer.
    stop_grace_period: 60s

volumes:
  idsjmk-data:
  brno-pgdata:
  collector-raw:
