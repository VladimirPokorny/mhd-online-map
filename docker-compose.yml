services:
  idsjmk-map:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8000
      - GTFS_URL=https://kordis-jmk.cz/gtfs/gtfs.zip
      - GTFS_UPDATE_INTERVAL_HOURS=6
      # Optional Umami analytics; set these in Dokploy's Environment tab.
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - UMAMI_SCRIPT_URL=${UMAMI_SCRIPT_URL:-}
      - UMAMI_DOMAINS=${UMAMI_DOMAINS:-}
    # Downloaded timetable versions and caches survive restarts and redeploys.
    volumes:
      - idsjmk-data:/app/data
    # Dokploy routes the domain to this port through its Traefik proxy.
    expose:
      - "8000"

volumes:
  idsjmk-data:
